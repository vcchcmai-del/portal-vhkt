# CNCT HCM — PRODUCTION STABLE
# Khuyến nghị dùng file này trên VPS/Docker Compose có quyền chạy nhiều service.
# PostgreSQL được lưu trực tiếp dưới ./data/postgres nên cập nhật code không xoá CSDL.
services:
  db:
    image: postgres:16-alpine
    container_name: portal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Chua dat POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-portal}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal} -d ${POSTGRES_DB:-portal}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    expose:
      - "5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: portal-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8000
      DATA_DIR: /app/data
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-portal}
      SECRET_KEY: ${SECRET_KEY:?Chua dat SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-10}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 7s
      retries: 12
      start_period: 30s
